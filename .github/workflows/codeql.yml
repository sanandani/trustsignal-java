name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  security-events: write
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934
        with: { languages: java-kotlin }
      - uses: github/codeql-action/autobuild@915412ff23e8b7659517e607487dbeae018f2934
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934
