name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - run: ./gradlew build
      - run: |
          mkdir -p build/reports/cyclonedx
          npx --yes @cyclonedx/cdxgen@11.6.0 -t java -o build/reports/cyclonedx/bom.json .
      - run: mkdir -p dist && cp build/libs/*.jar dist/ && cp build/reports/cyclonedx/bom.json dist/sbom.json
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with: { subject-path: 'dist/*' }
      - uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b
        with: { subject-path: 'dist/*.jar', sbom-path: 'dist/sbom.json' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: release-artifacts, path: dist/* }
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "${{ inputs.tag || github.ref_name }}" dist/* --generate-notes --verify-tag || gh release upload "${{ inputs.tag || github.ref_name }}" dist/* --clobber
