name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes: { label: What happened?, description: Use synthetic data only. }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: java
    attributes: { label: Java version }
